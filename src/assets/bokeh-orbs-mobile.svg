<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="softA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6eef7" stop-opacity="0.15"/>
      <stop offset="42%" stop-color="#c6d2e0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c6d2e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d8e1ec" stop-opacity="0.10"/>
      <stop offset="48%" stop-color="#c0ccda" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#c0ccda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="softC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cdd7e3" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#cdd7e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coolAmbient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5B8DEF" stop-opacity="0.05"/>
      <stop offset="60%" stop-color="#5B8DEF" stop-opacity="0.018"/>
      <stop offset="100%" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glassBody" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#46525f" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#232b34" stop-opacity="0.92"/>
      <stop offset="70%" stop-color="#0e1116" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#07090c" stop-opacity="0.98"/>
    </radialGradient>
    <radialGradient id="spec" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dce6f0" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#dce6f0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#dce6f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="80%">
      <stop offset="58%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
  </defs>

  <rect width="768" height="1024" fill="#050506"/>
  <circle cx="384" cy="420" r="520" fill="url(#coolAmbient)"/>

  <!-- Simplified out-of-focus orbs -->
  <circle cx="70" cy="140" r="280" fill="url(#softB)"/>
  <circle cx="690" cy="60" r="330" fill="url(#softA)"/>
  <circle cx="640" cy="990" r="310" fill="url(#softA)"/>
  <circle cx="40" cy="920" r="230" fill="url(#softC)"/>
  <circle cx="460" cy="700" r="200" fill="url(#softB)"/>

  <!-- Reduced sharp glass orbs -->
  <g>
    <circle cx="384" cy="430" r="40" fill="url(#glassBody)"/>
    <ellipse cx="372" cy="417" rx="18" ry="13" fill="url(#spec)"/>
    <ellipse cx="399" cy="448" rx="23" ry="14" fill="url(#rim)" transform="rotate(33 399 448)"/>
    <circle cx="384" cy="430" r="40" fill="none" stroke="rgba(220,230,240,0.16)" stroke-width="1"/>
  </g>
  <g>
    <circle cx="150" cy="210" r="26" fill="url(#glassBody)"/>
    <ellipse cx="142" cy="202" rx="11" ry="9" fill="url(#spec)"/>
    <circle cx="150" cy="210" r="26" fill="none" stroke="rgba(220,230,240,0.14)" stroke-width="1"/>
  </g>
  <g>
    <circle cx="620" cy="690" r="30" fill="url(#glassBody)"/>
    <ellipse cx="611" cy="680" rx="13" ry="10" fill="url(#spec)"/>
    <ellipse cx="631" cy="704" rx="17" ry="11" fill="url(#rim)" transform="rotate(32 631 704)"/>
    <circle cx="620" cy="690" r="30" fill="none" stroke="rgba(220,230,240,0.15)" stroke-width="1"/>
  </g>
  <g>
    <circle cx="90" cy="650" r="18" fill="url(#glassBody)"/>
    <ellipse cx="84" cy="643" rx="8" ry="6" fill="url(#spec)"/>
    <circle cx="90" cy="650" r="18" fill="none" stroke="rgba(220,230,240,0.14)" stroke-width="1"/>
  </g>

  <rect width="768" height="1024" fill="url(#vignette)"/>
</svg>
